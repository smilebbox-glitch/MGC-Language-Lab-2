name: Restore source language data

on:
  push:
    branches: [main]
    paths:
      - '.data-import/data_bundle.tar.xz'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source data bundle
        shell: bash
        run: |
          set -euo pipefail
          echo '3ae28b5ff792f12c1965775d9579a7362908ecbed3fd2113f8a7cd3dc0fa7663  .data-import/data_bundle.tar.xz' | sha256sum -c -
          xz -t .data-import/data_bundle.tar.xz
      - name: Restore tracked learning data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data
          tar -xJf .data-import/data_bundle.tar.xz
          test -f data/chinese.json
          test -f data/chinese_foundations.json
          test -f data/english.json
          test -f data/experience.json
          test -f data/app_content.json
          test -f data/admin_terms_import_template.csv
          rm -rf .data-import
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data .data-import
          git commit -m 'fix: restore tracked language source data'
          git push origin HEAD:main
