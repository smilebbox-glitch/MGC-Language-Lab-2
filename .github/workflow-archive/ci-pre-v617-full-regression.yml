name: mgc-languages-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-languages-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Existing static preflight
        run: bash scripts/static_preflight.sh
      - name: Extended language content contracts
        run: python tests/content_contract.py

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [base, pronunciation, putonghua, reliability, ops, v57, v571, v572, v573, v574, v575, v576, v577, v578, v579, v580, v581, v582, v583, v584, v585, v586, v587, v588, v589, v590]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Regression shard — ${{ matrix.shard }}
        run: python scripts/run_release_tests.py --shard "${{ matrix.shard }}" --timeout 75

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [static, regression]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t mgc-languages:ci .
      - name: Verify modular entrypoint, extracted routers and runtime bindings in image
        run: docker run --rm --entrypoint python mgc-languages:ci -c "import shutil, asgi; assert asgi.app; assert asgi.CONTRACT_REPORT.ok; assert asgi.ROUTER_BINDING_REPORT.ok; assert asgi.ROUTER_BINDING_REPORT.system_route_count == 5; assert asgi.ROUTER_BINDING_REPORT.root_mount_order_preserved; assert asgi.ROUTER_BINDING_REPORT.router_module_owned; assert asgi.OBSERVABILITY_ROUTER_BINDING_REPORT.ok; assert asgi.OBSERVABILITY_ROUTER_BINDING_REPORT.metrics_route_bound; assert asgi.OBSERVABILITY_ROUTER_BINDING_REPORT.root_mount_order_preserved; assert asgi.OBSERVABILITY_ROUTER_BINDING_REPORT.router_module_owned; assert asgi.OBSERVABILITY_ROUTER_BINDING_REPORT.renderer_module_owned; assert asgi.SECURITY_BINDING_REPORT.ok; assert asgi.GOVERNANCE_BINDING_REPORT.ok; assert asgi.GOVERNANCE_BINDING_REPORT.rls_bound; assert asgi.GOVERNANCE_BINDING_REPORT.audit_event_bound; assert asgi.LEARNING_BINDING_REPORT.ok; assert asgi.LEARNING_BINDING_REPORT.xp_profile_bound; assert asgi.LEARNING_BINDING_REPORT.xp_award_bound; assert asgi.LEARNING_BINDING_REPORT.srs_schedule_bound; assert asgi.SERVICE_BINDING_REPORT.ok; assert asgi.SERVICE_BINDING_REPORT.user_view_bound; assert asgi.SERVICE_BINDING_REPORT.terms_query_bound; assert asgi.SERVICE_BINDING_REPORT.revision_bound; assert asgi.TTS_BINDING_REPORT.ok; assert asgi.TTS_BINDING_REPORT.cache_bound; assert asgi.TTS_BINDING_REPORT.circuit_bound; assert asgi.TTS_BINDING_REPORT.synthesis_bound; assert asgi.TTS_BINDING_REPORT.health_bound; assert asgi.TTS_BINDING_REPORT.pronunciation_response_bound; assert asgi.TTS_BINDING_REPORT.state_bound; assert asgi.TTS_BINDING_REPORT.config_preserved; assert asgi.TTS_BINDING_REPORT.lru_cache_preserved; assert asgi.TTS_BINDING_REPORT.observability_state_compatible; assert asgi.TTS_BINDING_REPORT.hooks_captured; assert asgi.TTS_BINDING_REPORT.module_owned; assert asgi.WORKFLOW_BINDING_REPORT.ok; assert asgi.WORKFLOW_BINDING_REPORT.practice_route_bound; assert asgi.WORKFLOW_BINDING_REPORT.game_start