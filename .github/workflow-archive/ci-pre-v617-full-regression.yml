_REPORT.router_module_owned; assert asgi.PRACTICE_GAMES_ROUTER_BINDING_REPORT.auth_core_bound; assert asgi.PRACTICE_GAMES_ROUTER_BINDING_REPORT.workflow_service_bound; assert asgi.PRACTICE_GAMES_ROUTER_BINDING_REPORT.learning_service_captured; assert asgi.PRACTICE_GAMES_ROUTER_BINDING_REPORT.terminology_service_captured; assert asgi.TERMINOLOGY_ADMIN_ROUTER_BINDING_REPORT.ok; assert asgi.TERMINOLOGY_ADMIN_ROUTER_BINDING_REPORT.route_count == 13; assert asgi.TERMINOLOGY_ADMIN_ROUTER_BINDING_REPORT.public_route_count == 2; assert asgi.TERMINOLOGY_ADMIN_ROUTER_BINDING_REPORT.admin_term_route_count == 10; assert asgi.TERMINOLOGY_ADMIN_ROUTER_BINDING_REPORT.taxonomy_route_count == 1; assert asgi.TERMINOLOGY_ADMIN_ROUTER_BINDING_REPORT.router_module_owned; assert asgi.TERMINOLOGY_ADMIN_ROUTER_BINDING_REPORT.auth_core_bound; assert asgi.TERMINOLOGY_ADMIN_ROUTER_BINDING_REPORT.terminology_service_bound; assert asgi.TERMINOLOGY_ADMIN_ROUTER_BINDING_REPORT.governance_core_bound; assert asgi.PRONUNCIATION_ROUTER_BINDING_REPORT.ok; assert asgi.PRONUNCIATION_ROUTER_BINDING_REPORT.route_count == 3; assert asgi.PRONUNCIATION_ROUTER_BINDING_REPORT.status_route_count == 1; assert asgi.PRONUNCIATION_ROUTER_BINDING_REPORT.post_audio_route_count == 1; assert asgi.PRONUNCIATION_ROUTER_BINDING_REPORT.legacy_get_enabled; assert asgi.PRONUNCIATION_ROUTER_BINDING_REPORT.legacy_get_route_count == 1; assert asgi.PRONUNCIATION_ROUTER_BINDING_REPORT.router_module_owned; assert asgi.PRONUNCIATION_ROUTER_BINDING_REPORT.auth_core_bound; assert asgi.PRONUNCIATION_ROUTER_BINDING_REPORT.tts_core_bound; assert asgi.PRONUNCIATION_ROUTER_BINDING_REPORT.payload_schema_preserved; assert asgi.PRONUNCIATION_ROUTER_BINDING_REPORT.tts_max_chars_preserved; assert asgi.PRONUNCIATION_ROUTER_BINDING_REPORT.legacy_tts_handlers_captured; assert asgi.USER_MANAGER_ROUTER_BINDING_REPORT.ok; assert asgi.USER_MANAGER_ROUTER_BINDING_REPORT.route_count == 6; assert asgi.USER_MANAGER_ROUTER_BINDING_REPORT.admin_route_count == 4; assert asgi.USER_MANAGER_ROUTER_BINDING_REPORT.manager_route_count == 2; assert asgi.USER_MANAGER_ROUTER_BINDING_REPORT.mutation_route_count == 2; assert asgi.USER_MANAGER_ROUTER_BINDING_REPORT.router_module_owned; assert asgi.USER_MANAGER_ROUTER_BINDING_REPORT.payload_schema_preserved; assert asgi.USER_MANAGER_ROUTER_BINDING_REPORT.auth_core_bound; assert asgi.USER_MANAGER_ROUTER_BINDING_REPORT.user_service_bound; assert asgi.USER_MANAGER_ROUTER_BINDING_REPORT.manager_policy_bound; assert asgi.USER_MANAGER_ROUTER_BINDING_REPORT.governance_core_bound; assert asgi.PILOT_ADMIN_ROUTER_BINDING_REPORT.ok; assert asgi.PILOT_ADMIN_ROUTER_BINDING_REPORT.route_count == 13; assert asgi.PILOT_ADMIN_ROUTER_BINDING_REPORT.group_route_count == 9; assert asgi.PILOT_ADMIN_ROUTER_BINDING_REPORT.feature_route_count == 2; assert asgi.PILOT_ADMIN_ROUTER_BINDING_REPORT.assignment_route_count == 2; assert asgi.PILOT_ADMIN_ROUTER_BINDING_REPORT.export_route_count == 1; assert asgi.PILOT_ADMIN_ROUTER_BINDING_REPORT.governance_route_count == 1; assert asgi.PILOT_ADMIN_ROUTER_BINDING_REPORT.mutation_route_count == 9; assert asgi.PILOT_ADMIN_ROUTER_BINDING_REPORT.router_module_owned; assert asgi.PILOT_ADMIN_ROUTER_BINDING_REPORT.payload_schemas_preserved; assert asgi.PILOT_ADMIN_ROUTER_BINDING_REPORT.auth_core_bound; assert asgi.PILOT_ADMIN_ROUTER_BINDING_REPORT.user_service_bound; assert asgi.PILOT_ADMIN_ROUTER_BINDING_REPORT.governance_core_bound; assert asgi.ADMIN_OPS_ROUTER_BINDING_REPORT.ok; assert asgi.ADMIN_OPS_ROUTER_BINDING_REPORT.route_count == 13; assert asgi.ADMIN_OPS_ROUTER_BINDING_REPORT.mutation_route_count == 2; assert asgi.ADMIN_OPS_ROUTER_BINDING_REPORT.router_module_owned; assert asgi.ADMIN_OPS_ROUTER_BINDING_REPORT.payload_schema_preserved; assert asgi.ADMIN_OPS_ROUTER_BINDING_REPORT.auth_core_bound; assert asgi.ADMIN_OPS_ROUTER_BINDING_REPORT.user_service_bound; assert asgi.ADMIN_OPS_ROUTER_BINDING_REPORT.governance_core_bound; assert asgi.ADMIN_OPS_ROUTER_BINDING_REPORT.tts_core_bound; assert asgi.ADMIN_OPS_ROUTER_BINDING_REPORT.observability_helpers_available; assert shutil.which('espeak-ng')"
      - name: Start application container
        run: |
          docker run -d --name mgc-languages-ci \
            -p 8000:8000 \
            -e APP_ENV=development \
            -e AUTH_MODE=local \
            -e AUTO_CREATE_SCHEMA=true \
            -e DATABASE_URL=sqlite:////tmp/mgc-languages-ci.db \
            -e OIDC_STATE_SECRET=ci-runtime-state-secret-32-bytes \
            -e TTS_CACHE_PERSISTENCE=ephemeral \
            mgc-languages:ci
      - name: Run automated runtime smoke
        env:
          BASE_URL: http://127.0.0.1:8000
          SMOKE_STARTUP_TIMEOUT_SECONDS: '60'
        run: python tests/runtime_smoke.py
      - name: Capture runtime diagnostics
        if: failure()
        run: |
          docker inspect mgc-languages-ci > docker-inspect.json 2>&1 || true
          docker logs mgc-languages-ci > docker-runtime.log 2>&1 || true
          cat docker-runtime.log || true
      - name: Upload runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mgc-languages-runtime-diagnostics
          path: |
            docker-inspect.json
            docker-runtime.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop runtime container
        if: always()
        run: docker rm -f mgc-languages-ci || true
