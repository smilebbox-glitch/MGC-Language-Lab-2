name: mgc-languages-v607-final-assessment-frontend

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-v607-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-final-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend regressions
        run: |
          python scripts/run_release_tests.py --shard v606 --timeout 45
          python scripts/run_release_tests.py --shard v607 --timeout 45
      - name: JavaScript syntax
        run: |
          node --check static/frontend/legacy_bridge.js
          node --check static/frontend/final_assessment.js
          node --check static/frontend/navigation.js
          node --check static/frontend/boot.js
      - name: Final assessment parity guard
        run: |
          grep -q "frontend.register('final-assessment'" static/frontend/final_assessment.js
          grep -q "/final-exam" static/frontend/final_assessment.js
          grep -q "/api/final-exam/result" static/frontend/final_assessment.js
          grep -q "submitPractice" static/frontend/final_assessment.js
          grep -q "frontend.get('final-assessment').navigate(view)" static/frontend/navigation.js
