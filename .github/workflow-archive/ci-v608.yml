name: mgc-languages-v608-manager-admin-frontend

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-v608-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-manager-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend regressions
        run: |
          python scripts/run_release_tests.py --shard v607 --timeout 45
          python scripts/run_release_tests.py --shard v608 --timeout 45
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/frontend/manager_admin.js
          node --check static/frontend/legacy_bridge.js
          node --check static/frontend/navigation.js
          node --check static/frontend/boot.js
      - name: Manager admin parity guard
        run: |
          grep -q "frontend.register('manager-admin'" static/frontend/manager_admin.js
          grep -q "/api/manager/team" static/frontend/manager_admin.js
          grep -q "frontend.get('admin-analytics').renderAdmin()" static/frontend/manager_admin.js
          grep -q "frontend.get('content-governance').renderEditor()" static/frontend/manager_admin.js
          ! grep -q "renderAdmin:" static/frontend/legacy_bridge.js
          ! grep -q "function renderAdmin" static/app.js
          ! grep -q "function renderManager" static/app.js
          grep -q "frontend.get('manager-admin').navigate(view)" static/frontend/navigation.js
