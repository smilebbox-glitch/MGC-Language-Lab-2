name: mgc-languages-v604-practice-games-frontend

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-v604-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-practice-games:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend regressions
        run: |
          python scripts/run_release_tests.py --shard v603 --timeout 45
          python scripts/run_release_tests.py --shard v604 --timeout 45
      - name: JavaScript syntax
        run: |
          node --check static/frontend/practice_games.js
          node --check static/frontend/navigation.js
          node --check static/frontend/legacy_bridge.js
          node --check static/frontend/boot.js
      - name: Feature parity guard
        run: |
          grep -q "frontend.register('practice-games'" static/frontend/practice_games.js
          grep -q "xp_economy" static/frontend/practice_games.js
          grep -q "frontend.get('practice-games').navigate(view)" static/frontend/navigation.js
