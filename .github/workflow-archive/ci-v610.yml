name: mgc-languages-v610-admin-ops-frontend

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-v610-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-admin-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend regressions
        run: |
          python scripts/run_release_tests.py --shard v609 --timeout 45
          python scripts/run_release_tests.py --shard v610 --timeout 45
      - name: JavaScript syntax
        run: |
          node --check static/frontend/admin_ops.js
          node --check static/frontend/content_governance.js
          node --check static/frontend/manager_admin.js
          node --check static/frontend/boot.js
      - name: Admin operations parity guard
        run: |
          grep -q "frontend.register('admin-ops'" static/frontend/admin_ops.js
          grep -q "/api/admin/pilot/groups" static/frontend/admin_ops.js
          grep -q "/features/" static/frontend/admin_ops.js
          grep -q "/assignments" static/frontend/admin_ops.js
          grep -q "/api/admin/maintenance/cleanup?dry_run=true" static/frontend/admin_ops.js
          grep -q "/api/admin/alerts/" static/frontend/admin_ops.js
          grep -q "root.pilotGovernanceHTML = pilotGovernanceHTML" static/frontend/admin_ops.js
          grep -q "root.bindITDashboard = bindITDashboard" static/frontend/admin_ops.js
