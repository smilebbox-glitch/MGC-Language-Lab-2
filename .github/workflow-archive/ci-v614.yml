name: mgc-languages-v614-core-learning-frontend

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-v614-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-core-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend regressions
        run: |
          python scripts/run_release_tests.py --shard v603 --timeout 45
          python scripts/run_release_tests.py --shard v613 --timeout 45
          python scripts/run_release_tests.py --shard v614 --timeout 45
      - name: JavaScript syntax
        run: |
          node --check static/frontend/learning.js
          node --check static/frontend/practice_games.js
          node --check static/frontend/legacy_bridge.js
          node --check static/frontend/legacy_retirement.js
          node --check static/frontend/navigation.js
          node --check static/frontend/boot.js
      - name: Core learning parity guard
        run: |
          grep -q "frontend.register('learning'" static/frontend/learning.js
          grep -q "/terms?topic=" static/frontend/learning.js
          grep -q "/quiz?topic=" static/frontend/learning.js
          grep -q "/course30" static/frontend/learning.js
          grep -q "/api/course-day/result" static/frontend/learning.js
          grep -q "/api/gamification/spend" static/frontend/learning.js
          grep -q "/api/me/language" static/frontend/learning.js
          grep -q "/api/learning/preferences" static/frontend/learning.js
          grep -q "legacy().submitPractice" static/frontend/learning.js
          grep -q "legacy().playPronunciation" static/frontend/learning.js
          ! grep -q "renderLearningHome" static/frontend/learning.js
          ! grep -q "renderLearningHome:" static/frontend/legacy_bridge.js
          grep -q "'renderHome'" static/frontend/legacy_retirement.js
          grep -q "'renderCourse30'" static/frontend/legacy_retirement.js
          ! grep -q "renderPracticeRoleplay:" static/frontend/legacy_bridge.js
          grep -q "'renderRoleplay'" static/frontend/legacy_retirement.js
