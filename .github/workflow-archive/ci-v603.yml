name: mgc-languages-v603-learning-frontend

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-v603-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core regressions
        run: |
          python scripts/run_release_tests.py --shard v600 --timeout 45
          python scripts/run_release_tests.py --shard v601 --timeout 45
          python scripts/run_release_tests.py --shard v602 --timeout 45
      - name: Learning ownership contract
        run: python scripts/run_release_tests.py --shard v603 --timeout 45
      - name: JavaScript syntax
        run: |
          node --check static/frontend/learning.js
          node --check static/frontend/navigation.js
          node --check static/frontend/legacy_bridge.js
          node --check static/frontend/boot.js
      - name: Ownership guard
        run: |
          grep -q "frontend.register('learning'" static/frontend/learning.js
          grep -q "Object.freeze(\['home', 'topics', 'quiz', 'course30'\])" static/frontend/learning.js
          grep -q "frontend.get('learning').navigate(view)" static/frontend/navigation.js
