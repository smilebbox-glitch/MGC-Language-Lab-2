name: mgc-languages-v613-legacy-cleanup-frontend

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-v613-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-legacy-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend regressions
        run: |
          python scripts/run_release_tests.py --shard v612 --timeout 45
          python scripts/run_release_tests.py --shard v613 --timeout 45
      - name: JavaScript syntax
        run: |
          node --check static/frontend/learning.js
          node --check static/frontend/practice_games.js
          node --check static/frontend/legacy_bridge.js
          node --check static/frontend/legacy_retirement.js
          node --check static/frontend/navigation.js
          node --check static/frontend/boot.js
      - name: Legacy surface guard
        run: |
          grep -q "frontend.register('legacy-retirement'" static/frontend/legacy_retirement.js
          grep -q "'renderAdmin'" static/frontend/legacy_retirement.js
          grep -q "'renderManager'" static/frontend/legacy_retirement.js
          grep -q "'renderChineseBasics'" static/frontend/legacy_retirement.js
          grep -q "'renderExam'" static/frontend/legacy_retirement.js
          grep -q "'renderAssistant'" static/frontend/legacy_retirement.js
          grep -q "'renderNotifications'" static/frontend/legacy_retirement.js
          grep -q "'renderHome'" static/frontend/legacy_retirement.js
          grep -q "'renderCourse30'" static/frontend/legacy_retirement.js
          grep -q "'renderRoleplay'" static/frontend/legacy_retirement.js
          grep -q "'renderGames'" static/frontend/legacy_retirement.js
          grep -q "'renderXP'" static/frontend/legacy_retirement.js
          grep -q "bridge.surface = Object.freeze(Object.keys(bridge))" static/frontend/legacy_bridge.js
          ! grep -q "renderManager:" static/frontend/legacy_bridge.js
          ! grep -q "renderAdmin:" static/frontend/legacy_bridge.js
          ! grep -q "renderLearningHome:" static/frontend/legacy_bridge.js
          ! grep -q "renderLearningCourse30:" static/frontend/legacy_bridge.js
          ! grep -q "renderPracticeRoleplay:" static/frontend/legacy_bridge.js
          ! grep -q "renderPracticeGames:" static/frontend/legacy_bridge.js
          ! grep -q "renderPracticeXP:" static/frontend/legacy_bridge.js
          grep -q "'legacy-retirement'" static/frontend/boot.js
