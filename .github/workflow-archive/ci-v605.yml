name: mgc-languages-v605-support-notifications-frontend

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-v605-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-support-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend regressions
        run: |
          python scripts/run_release_tests.py --shard v604 --timeout 45
          python scripts/run_release_tests.py --shard v605 --timeout 45
      - name: JavaScript syntax
        run: |
          node --check static/frontend/support_notifications.js
          node --check static/frontend/navigation.js
          node --check static/frontend/boot.js
      - name: Notification parity guard
        run: |
          grep -q "frontend.register('support-notifications'" static/frontend/support_notifications.js
          grep -q "learning_nudges" static/frontend/support_notifications.js
          grep -q "/api/notifications/settings" static/frontend/support_notifications.js
          grep -q "frontend.get('support-notifications').navigate(view)" static/frontend/navigation.js
