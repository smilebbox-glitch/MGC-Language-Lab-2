name: mgc-languages-v591-gate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mgc-languages-v591-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run v5.9.1 notifications regression shard
        run: python scripts/run_release_tests.py --shard v591 --timeout 75
      - name: Build Docker image
        run: docker build -t mgc-languages:v591 .
      - name: Verify notifications router binding in image
        run: |
          docker run --rm --entrypoint python mgc-languages:v591 -c "import asgi; r=asgi.NOTIFICATIONS_ROUTER_BINDING_REPORT; assert r.ok; assert r.route_count==4; assert r.settings_route_count==2; assert r.nudge_route_count==2; assert r.mutation_route_count==2; assert r.route_names_preserved; assert r.response_classes_preserved; assert r.payload_schema_preserved; assert r.root_mount_order_preserved; assert r.router_module_owned; assert r.auth_core_bound; assert r.learning_service_bound"
