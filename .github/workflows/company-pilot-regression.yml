name: MGC Language Lab 2 Company Pilot Regression

on:
  push:
    branches:
      - main
      - fix/company-pilot-env-template
      - fix/lan-db-password-sync
    paths:
      - .env.company-pilot.example
      - scripts/start_company_pilot.ps1
      - scripts/start_lan_windows.ps1
      - scripts/repair_lan_db_password.ps1
      - scripts/company_pilot_preflight.py
      - docker-compose.pilot.yml
      - docker-compose.lan.yml
      - static/index.html
      - static/frontend/navigation.js
      - static/frontend/premium_home_v631.js
      - static/premium_home_v631.css
      - tests/test_mgc_language_lab_2_premium.py
      - tests/test_lan_db_password_recovery_contract.py
      - .github/workflows/company-pilot-regression.yml
  pull_request:
    paths:
      - .env.company-pilot.example
      - scripts/start_company_pilot.ps1
      - scripts/start_lan_windows.ps1
      - scripts/repair_lan_db_password.ps1
      - scripts/company_pilot_preflight.py
      - docker-compose.pilot.yml
      - docker-compose.lan.yml
      - static/index.html
      - static/frontend/navigation.js
      - static/frontend/premium_home_v631.js
      - static/premium_home_v631.css
      - tests/test_mgc_language_lab_2_premium.py
      - tests/test_lan_db_password_recovery_contract.py
      - .github/workflows/company-pilot-regression.yml
  workflow_dispatch:

jobs:
  company-pilot-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require company pilot template
        run: test -f .env.company-pilot.example

      - name: Validate secure template contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.env.company-pilot.example').read_text(encoding='utf-8')
          required = [
              'APP_VERSION=6.0.31',
              'AUTH_MODE=oidc',
              'REGISTRATION_ENABLED=false',
              'COOKIE_SECURE=true',
              'READY_REQUIRE_OIDC=true',
              'READY_REQUIRE_SECURE_COOKIE=true',
              'READY_REQUIRE_SCHEMA_HEAD=true',
              'READY_REQUIRE_RLS=true',
              'READY_REQUIRE_TERM_APPROVAL=true',
              'RLS_ENABLED=true',
              'TERM_APPROVAL_REQUIRED=true',
          ]
          for token in required:
              assert token in text, token
          for key in ('POSTGRES_PASSWORD', 'OIDC_STATE_SECRET', 'OIDC_CLIENT_ID', 'OIDC_CLIENT_SECRET', 'METRICS_TOKEN'):
              line = next((line for line in text.splitlines() if line.startswith(key + '=')), '')
              assert 'CHANGE_ME' in line, f'{key} must remain a placeholder in the tracked example'
          print('PASS: secure company pilot example contract')
          PY

      - name: Verify premium design remains canonical
        run: python tests/test_mgc_language_lab_2_premium.py

      - name: Verify LAN database password recovery contract
        run: python tests/test_lan_db_password_recovery_contract.py

      - name: Validate LAN PowerShell syntax
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw scripts/repair_lan_db_password.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw scripts/start_lan_windows.ps1)) | Out-Null

      - name: Reproduce and repair persistent LAN PostgreSQL password mismatch
        shell: bash
        run: |
          set -euo pipefail
          cat > .env.ci-lan <<'EOF'
          POSTGRES_DB=mgc_languages
          POSTGRES_USER=mgc_languages
          POSTGRES_PASSWORD=ci-old-db-password-0123456789
          POSTGRES_MAX_CONNECTIONS=120
          OIDC_STATE_SECRET=ci-lan-state-secret-0123456789abcdef
          METRICS_TOKEN=ci-lan-metrics-secret-0123456789abcdef
          MGC_ADMIN_PASSWORD=ci-lan-admin-password-0123456789
          EOF

          docker compose --env-file .env.ci-lan -f docker-compose.lan.yml down -v --remove-orphans || true
          docker compose --env-file .env.ci-lan -f docker-compose.lan.yml up -d db

          for i in $(seq 1 45); do
            if docker compose --env-file .env.ci-lan -f docker-compose.lan.yml exec -T db pg_isready -U mgc_languages -d mgc_languages >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker compose --env-file .env.ci-lan -f docker-compose.lan.yml exec -T db pg_isready -U mgc_languages -d mgc_languages
          docker compose --env-file .env.ci-lan -f docker-compose.lan.yml exec -T db psql -U mgc_languages -d mgc_languages -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS password_recovery_probe (id integer primary key, note text not null); INSERT INTO password_recovery_probe (id, note) VALUES (1, 'keep-me') ON CONFLICT (id) DO UPDATE SET note = EXCLUDED.note;"

          sed -i 's/ci-old-db-password-0123456789/ci-new-db-password-9876543210/' .env.ci-lan

          if docker compose --env-file .env.ci-lan -f docker-compose.lan.yml exec -T -e PGPASSWORD=ci-new-db-password-9876543210 db psql -h 127.0.0.1 -U mgc_languages -d mgc_languages -tAc 'SELECT 1' >/dev/null 2>&1; then
            echo 'Expected new password to fail before reconciliation' >&2
            exit 1
          fi

          pwsh -NoProfile -File scripts/repair_lan_db_password.ps1 -EnvFile .env.ci-lan -ComposeFile docker-compose.lan.yml

          docker compose --env-file .env.ci-lan -f docker-compose.lan.yml exec -T -e PGPASSWORD=ci-new-db-password-9876543210 db psql -h 127.0.0.1 -U mgc_languages -d mgc_languages -tAc "SELECT note FROM password_recovery_probe WHERE id=1" | grep -q 'keep-me'

          if docker compose --env-file .env.ci-lan -f docker-compose.lan.yml exec -T -e PGPASSWORD=ci-old-db-password-0123456789 db psql -h 127.0.0.1 -U mgc_languages -d mgc_languages -tAc 'SELECT 1' >/dev/null 2>&1; then
            echo 'Old password still authenticates after reconciliation' >&2
            exit 1
          fi

      - name: Clean LAN PostgreSQL regression stack
        if: always()
        run: docker compose --env-file .env.ci-lan -f docker-compose.lan.yml down -v --remove-orphans || true

      - name: Exercise company preflight with disposable values
        shell: bash
        run: |
          cp .env.company-pilot.example .env.ci-company-pilot
          python - <<'PY'
          from pathlib import Path
          path = Path('.env.ci-company-pilot')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'POSTGRES_PASSWORD=CHANGE_ME_STRONG_DB_PASSWORD': 'POSTGRES_PASSWORD=ci-db-secret-0123456789abcdef',
              'OIDC_STATE_SECRET=CHANGE_ME_RANDOM_32_BYTES_OR_MORE': 'OIDC_STATE_SECRET=ci-state-secret-0123456789abcdef0123456789abcdef',
              'METRICS_TOKEN=CHANGE_ME_RANDOM_METRICS_TOKEN': 'METRICS_TOKEN=ci-metrics-secret-0123456789abcdef',
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/company_pilot_preflight.py --env-file .env.ci-company-pilot --json

      - name: Validate pilot compose model
        run: docker compose --env-file .env.ci-company-pilot -f docker-compose.pilot.yml config --quiet

      - name: Validate premium navigation syntax
        run: node --check static/frontend/navigation.js && node --check static/frontend/premium_home_v631.js
