name: Bootstrap MGC Language Lab 2 Premium

on:
  push:
    branches:
      - build/server-premium-design
    paths:
      - .github/workflows/bootstrap-mgc-language-lab-2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout MGC Language Lab 2
        uses: actions/checkout@v4
        with:
          ref: build/server-premium-design
          path: target
          fetch-depth: 0

      - name: Checkout current working language service
        uses: actions/checkout@v4
        with:
          repository: smilebbox-glitch/mgc-languages
          ref: main
          path: source
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build, verify, smoke-test and commit Language Lab 2
        shell: bash
        run: bash target/.github/bootstrap-mgc-language-lab-2.sh target source
