<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8fbfe">
  <title>MGC Language Lab — нет соединения</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f8fbfe; color:#13263b; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; }
    main { width:min(560px,100%); background:#fff; border:1px solid #dbe6ef; border-radius:24px; padding:32px; box-shadow:0 18px 60px rgba(19,38,59,.08); }
    .mark { width:56px; height:56px; display:grid; place-items:center; border-radius:16px; background:#13263b; color:#fff; font-weight:800; font-size:24px; }
    h1 { margin:24px 0 12px; font-size:clamp(24px,5vw,34px); }
    p { margin:0; line-height:1.6; color:#486177; }
    a { display:inline-block; margin-top:24px; border-radius:14px; background:#13263b; color:#fff; padding:12px 18px; font:inherit; font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <h1>Нет соединения с MGC Language Lab</h1>
    <p>Для входа, учебных данных и синхронизации требуется защищённое соединение с сервером. Персональные данные и ответы API намеренно не сохраняются сервис-воркером для офлайн-доступа.</p>
    <a href="/">Повторить подключение</a>
  </main>
</body>
</html>
