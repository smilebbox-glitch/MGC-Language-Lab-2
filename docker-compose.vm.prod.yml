name: mgc-languages-vm

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mgc_languages}
      POSTGRES_USER: ${POSTGRES_USER:-mgc_languages}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vm}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-80}
    volumes:
      - vm_pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mgc_languages} -d ${POSTGRES_DB:-mgc_languages}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    mem_limit: ${MGC_DB_MEMORY_LIMIT:-1g}
    cpus: ${MGC_DB_CPU_LIMIT:-1.0}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mgc-languages:vm
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: pilot
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mgc_languages}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mgc_languages}
      AUTO_CREATE_SCHEMA: "false"
      EXPECTED_ALEMBIC_HEAD: c57d0a31f570
      READY_REQUIRE_POSTGRES: "true"
      READY_REQUIRE_SCHEMA_HEAD: "true"
      READY_REQUIRE_REGISTRATION_DISABLED: "false"
      READY_REQUIRE_METRICS_TOKEN: "true"
      READY_REQUIRE_OIDC: "false"
      READY_REQUIRE_SECURE_COOKIE: "true"
      READY_REQUIRE_RLS: "true"
      READY_REQUIRE_TERM_APPROVAL: "true"
      AUTH_MODE: local
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      TRUSTED_HOSTS: ${MGC_TRUSTED_HOSTS:?Set MGC_TRUSTED_HOSTS in .env.vm}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OIDC_STATE_SECRET: ${OIDC_STATE_SECRET:?Set OIDC_STATE_SECRET in .env.vm}
      MGC_ADMIN_USERNAME: ${MGC_ADMIN_USERNAME:-admin}
      MGC_ADMIN_PASSWORD: ${MGC_ADMIN_PASSWORD:?Set MGC_ADMIN_PASSWORD in .env.vm}
      MGC_ADMIN_DISPLAY_NAME: ${MGC_ADMIN_DISPLAY_NAME:-MGC Admin}
      MGC_ADMIN_DEPARTMENT: ${MGC_ADMIN_DEPARTMENT:-Администрация}
      MGC_ADMIN_SYNC_CREDENTIALS: ${MGC_ADMIN_SYNC_CREDENTIALS:-true}
      METRICS_ENABLED: "true"
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env.vm}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      UVICORN_LIMIT_CONCURRENCY: ${UVICORN_LIMIT_CONCURRENCY:-200}
      UVICORN_BACKLOG: ${UVICORN_BACKLOG:-1024}
      UVICORN_KEEP_ALIVE_SECONDS: ${UVICORN_KEEP_ALIVE_SECONDS:-5}
      FORWARDED_ALLOW_IPS: "*"
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-80}
      DB_CONNECTION_RESERVE: ${DB_CONNECTION_RESERVE:-20}
      CAPACITY_EXPECTED_AUX_CONNECTIONS: ${CAPACITY_EXPECTED_AUX_CONNECTIONS:-8}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      DB_READY_MAX_LATENCY_MS: ${DB_READY_MAX_LATENCY_MS:-1500}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_ALERT_PERCENT: ${DB_POOL_ALERT_PERCENT:-80}
      RLS_ENABLED: "true"
      TERM_APPROVAL_REQUIRED: "true"
      TTS_ENABLED: "false"
      TTS_DISK_CACHE_ENABLED: "false"
      TTS_LEGACY_GET_ENABLED: "false"
      PILOT_DAILY_XP_CAP: ${PILOT_DAILY_XP_CAP:-2500}
      PILOT_DAILY_GAME_START_CAP: ${PILOT_DAILY_GAME_START_CAP:-150}
      PILOT_DAILY_TTS_CAP: ${PILOT_DAILY_TTS_CAP:-0}
      PILOT_DAILY_PRACTICE_CAP: ${PILOT_DAILY_PRACTICE_CAP:-300}
    command: ["/app/scripts/entrypoint.sh"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    restart: unless-stopped
    mem_limit: ${MGC_APP_MEMORY_LIMIT:-2g}
    cpus: ${MGC_APP_CPU_LIMIT:-2.0}

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${MGC_BIND_ADDRESS:-0.0.0.0}:${MGC_HTTPS_PORT:-443}:8443"
    volumes:
      - ./deploy/nginx/vm-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/vm/runtime/certs:/etc/nginx/tls:ro
    networks: [edge, backend]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:8443/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped
    mem_limit: ${MGC_NGINX_MEMORY_LIMIT:-256m}
    cpus: ${MGC_NGINX_CPU_LIMIT:-0.25}

networks:
  edge: {}
  backend:
    internal: true

volumes:
  vm_pgdata: {}
