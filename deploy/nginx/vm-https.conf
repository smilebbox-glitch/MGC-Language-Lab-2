limit_req_zone $binary_remote_addr zone=mgc_vm_auth_rate:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=mgc_vm_api_rate:10m rate=12r/s;
limit_conn_zone $binary_remote_addr zone=mgc_vm_conn:10m;
limit_req_status 429;
limit_conn_status 429;

upstream mgc_vm_app {
    server app:8000;
    keepalive 64;
}

server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MGC_VM_TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 6m;
    keepalive_timeout 30s;
    keepalive_requests 1000;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    proxy_hide_header X-Powered-By;

    location ~ /\. {
        return 404;
    }

    location ~ ^/api/(login|register)$ {
        limit_req zone=mgc_vm_auth_rate burst=10 nodelay;
        limit_conn mgc_vm_conn 10;
        proxy_pass http://mgc_vm_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Proxy "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Rate-limit API traffic, not the static application shell. A cold browser/PWA
    # load legitimately requests >72 local CSS/JS assets in a short burst; throttling
    # location / caused late 3D modules to receive HTTP 429 on first load.
    location /api/ {
        limit_req zone=mgc_vm_api_rate burst=72 nodelay;
        limit_conn mgc_vm_conn 40;
        proxy_pass http://mgc_vm_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Proxy "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # HTML, CSS, JS, SVG and WebGL modules must be available without request-rate
    # throttling. Connection limits remain in place and sensitive endpoints are
    # handled by the API/auth locations above.
    location / {
        limit_conn mgc_vm_conn 40;
        proxy_pass http://mgc_vm_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Proxy "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
