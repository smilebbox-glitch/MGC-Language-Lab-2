limit_req_zone $binary_remote_addr zone=mgc_auth_rate:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=mgc_app_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mgc_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Preserve the external HTTPS scheme only when the front gateway explicitly
# forwarded it. Direct/local traffic falls back to the transport nginx sees.
map $http_x_forwarded_proto $mgc_forwarded_proto {
    default $scheme;
    https https;
}

upstream mgc_app {
    server app:8000;
    keepalive 64;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 6m;
    keepalive_timeout 30s;
    keepalive_requests 1000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    proxy_hide_header X-Powered-By;

    location ~ /\. {
        return 404;
    }

    location ~ ^/api/(login|register)$ {
        limit_req zone=mgc_auth_rate burst=10 nodelay;
        limit_conn mgc_conn 10;

        proxy_pass http://mgc_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mgc_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        limit_req zone=mgc_app_rate burst=60 nodelay;
        limit_conn mgc_conn 30;

        proxy_pass http://mgc_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mgc_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
