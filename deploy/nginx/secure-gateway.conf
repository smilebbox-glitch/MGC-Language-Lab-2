limit_req_zone $binary_remote_addr zone=mgc_edge_rate:10m rate=12r/s;
limit_conn_zone $binary_remote_addr zone=mgc_edge_conn:10m;
limit_req_status 429;
limit_conn_status 429;

upstream mgc_inner_gateway {
    server nginx:8080;
    keepalive 64;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Never allow authenticated mobile/browser traffic to remain on plaintext HTTP.
    return 308 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MGC_TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 6m;
    keepalive_timeout 30s;
    keepalive_requests 1000;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location ~ /\. {
        return 404;
    }

    location / {
        limit_req zone=mgc_edge_rate burst=72 nodelay;
        limit_conn mgc_edge_conn 40;

        proxy_pass http://mgc_inner_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Proxy "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
