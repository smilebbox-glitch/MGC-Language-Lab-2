services:
  wal-init:
    cap_add:
      - FOWNER

  secure-gateway:
    image: nginx:1.27-alpine
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - "${MGC_BIND_ADDRESS:-0.0.0.0}:${MGC_HTTP_PORT:-80}:8080"
      - "${MGC_BIND_ADDRESS:-0.0.0.0}:${MGC_HTTPS_PORT:-443}:8443"
    volumes:
      - ./deploy/nginx/secure-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:?Set TLS_CERT_FILE in .env.pilot}:/etc/nginx/tls/tls.crt:ro
      - ${TLS_KEY_FILE:?Set TLS_KEY_FILE in .env.pilot}:/etc/nginx/tls/tls.key:ro
    networks: [edge]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Keep the host TLS private key at 0600. The nginx master needs read-only
    # DAC bypass for a bind-mounted key owned by the host runtime user; this
    # avoids making the private key group/world-readable.
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETGID
      - SETUID
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:8443/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s
